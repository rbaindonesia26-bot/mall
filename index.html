<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUQNA - Web App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Sembunyikan scrollbar untuk tampilan mirip aplikasi asli */
        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }
        body {
            -webkit-tap-highlight-color: transparent;
        }
        /* Animasi transisi halaman */
        .fade-in {
            animation: fadeIn 0.2s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-gray-200 text-gray-800 font-sans flex justify-center min-h-screen items-center">

    <div id="app" class="w-full max-w-md h-[100dvh] sm:h-[90vh] mx-auto bg-white relative shadow-2xl sm:rounded-[2.5rem] sm:border-8 border-gray-800 overflow-hidden flex flex-col">
        
        <!-- Notifikasi (Toast) -->
        <div id="toast" class="hidden absolute top-24 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-5 py-2.5 rounded-full text-xs font-bold z-[100] shadow-2xl transition-all whitespace-nowrap">
        </div>

        <!-- Custom Modal untuk Checkout -->
        <div id="modal" class="hidden absolute inset-0 bg-black/60 z-[100] flex items-center justify-center p-4 backdrop-blur-sm transition-opacity">
            <div class="bg-white rounded-3xl p-6 max-w-[85%] w-full text-center shadow-2xl transform scale-100 transition-transform">
                <div class="w-16 h-16 bg-[#009669]/10 text-[#009669] rounded-full flex items-center justify-center mx-auto mb-4">
                    <i data-lucide="check-circle" class="w-8 h-8"></i>
                </div>
                <h3 id="modal-title" class="text-xl font-bold text-gray-800 mb-2">Sukses</h3>
                <p id="modal-desc" class="text-sm text-gray-600 mb-6">Operasi berhasil dilakukan.</p>
                <button onclick="window.closeModal()" class="w-full bg-[#009669] text-white font-bold py-3.5 rounded-xl hover:bg-emerald-700 transition-colors shadow-lg shadow-emerald-200">
                    Selesai
                </button>
            </div>
        </div>

        <!-- Area Konten Utama (Scrollable) -->
        <main id="content" class="flex-1 overflow-y-auto relative bg-white pb-24 transition-all duration-300">
            <!-- Isi layar (Beranda, Keranjang, Akun) akan dirender di sini via JS -->
        </main>

        <nav id="bottom-nav" class="absolute bottom-0 w-full bg-white border-t border-gray-100 flex justify-between px-6 pt-3 pb-4 shadow-[0_-10px_30px_rgba(0,0,0,0.04)] z-50 pb-safe transition-transform duration-300">
            <button onclick="window.navigate('home')" id="nav-home" class="flex flex-col items-center gap-1.5 transition-colors w-16 group">
                <i data-lucide="home" class="w-6 h-6 text-[#009669] group-active:scale-95 transition-transform"></i>
                <span class="text-[10px] font-bold text-[#009669]">Beranda</span>
            </button>
            <button onclick="window.navigate('cart')" id="nav-cart" class="flex flex-col items-center gap-1.5 transition-colors w-16 relative group">
                <div id="cart-badge" class="hidden absolute -top-1 right-2 bg-red-500 text-white text-[9px] font-bold w-4 h-4 flex items-center justify-center rounded-full shadow-sm border-2 border-white">0</div>
                <i data-lucide="shopping-cart" class="w-6 h-6 text-gray-400 group-hover:text-gray-600 group-active:scale-95 transition-all"></i>
                <span class="text-[10px] font-medium text-gray-400">Keranjang</span>
            </button>
            <button onclick="window.navigate('account')" id="nav-account" class="flex flex-col items-center gap-1.5 transition-colors w-16 group">
                <i data-lucide="user" class="w-6 h-6 text-gray-400 group-hover:text-gray-600 group-active:scale-95 transition-all"></i>
                <span class="text-[10px] font-medium text-gray-400">Akun</span>
            </button>
        </nav>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, deleteDoc, doc, updateDoc, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Konfigurasi Firebase Anda
        const firebaseConfig = {
            apiKey: "AIzaSyAJBYNDoW3lT0mHvO3gH5WKZoEMWTFs_5M",
            authDomain: "suqna-d8344.firebaseapp.com",
            projectId: "suqna-d8344",
            storageBucket: "suqna-d8344.firebasestorage.app",
            messagingSenderId: "424982355557",
            appId: "1:424982355557:web:9d1574c87d49eb2a2a708c"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // State Global
        window.currentView = 'home';
        window.role = 'buyer'; 
        window.storeAuthMode = 'login'; 
        window.isAddingProduct = false; 
        window.isEditingProfile = false; 
        window.userId = null;
        window.currentProductDetail = null;
        window.isStoreUnlocked = false; 
        
        window.banners = [
            {
                tag: "TETANGGAKU",
                tagColor: "text-[#00c98f]",
                title: "Sayur Segar<br>Tiap Pagi",
                img: "https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&q=80&w=800"
            },
            {
                tag: "PROMO BERKAH",
                tagColor: "text-amber-400",
                title: "Kurma Ajwa<br>Diskon 30%",
                img: "https://images.unsplash.com/photo-1589539148230-0a5b707bc77c?auto=format&fit=crop&q=80&w=800"
            },
            {
                tag: "HALAL FOOD",
                tagColor: "text-rose-400",
                title: "Jajanan Segar<br>& Organik",
                img: "https://images.unsplash.com/photo-1587049352847-4d4b12b1413e?auto=format&fit=crop&q=80&w=800"
            }
        ];
        window.currentBannerIndex = 0;
        window.bannerInterval = null;

        window.storeProfile = { name: "Toko Baru", phone: "", avatar: "" };
        window.tempUploadedAvatar = '';
        window.tempProductImg = '';
        
        window.currentSearchQuery = '';
        window.currentCategoryFilter = 'Semua';

        window.categories = [
            { name: "Semua", icon: "layout-grid", bg: "bg-[#009669]", textColor: "text-[#009669] font-bold", iconColor: "text-white" },
            { name: "Belanja & Retail", icon: "shopping-bag", bg: "bg-orange-100/70", textColor: "text-gray-600 font-medium", iconColor: "text-orange-500" },
            { name: "Kendaraan", icon: "car", bg: "bg-blue-100/70", textColor: "text-gray-600 font-medium", iconColor: "text-blue-500" },
            { name: "Properti", icon: "building-2", bg: "bg-indigo-100/70", textColor: "text-gray-600 font-medium", iconColor: "text-indigo-500" },
            { name: "Pendidikan", icon: "book-open", bg: "bg-yellow-100/70", textColor: "text-gray-600 font-medium", iconColor: "text-yellow-600" },
            { name: "Bisnis & Grosir", icon: "briefcase", bg: "bg-purple-100/70", textColor: "text-gray-600 font-medium", iconColor: "text-purple-500" },
            { name: "Hobi & Gaya Hidup", icon: "heart", bg: "bg-pink-100/70", textColor: "text-gray-600 font-medium", iconColor: "text-pink-500" },
            { name: "Produk Digital", icon: "monitor", bg: "bg-cyan-100/70", textColor: "text-gray-600 font-medium", iconColor: "text-cyan-500" },
            { name: "Jasa & Layanan", icon: "wrench", bg: "bg-green-100/70", textColor: "text-gray-600 font-medium", iconColor: "text-green-500" },
            { name: "Perjalanan & Wisata", icon: "plane", bg: "bg-teal-100/70", textColor: "text-gray-600 font-medium", iconColor: "text-teal-500" },
            { name: "Barang Bekas", icon: "archive", bg: "bg-amber-100/70", textColor: "text-gray-600 font-medium", iconColor: "text-amber-600" },
            { name: "Lainnya", icon: "more-horizontal", bg: "bg-gray-100", textColor: "text-gray-600 font-medium", iconColor: "text-gray-600" },
        ];

        window.categoryData = {
            "Belanja & Retail": ["Logam Mulia & Emas", "Fashion & Busana", "Makanan & Minuman", "Kesehatan & Kecantikan", "Elektronik & Gadget", "Kebutuhan Rumah Tangga"],
            "Kendaraan": ["Mobil Baru", "Mobil Bekas", "Motor Baru", "Motor Bekas", "Aksesoris & Suku Cadang", "Rental Kendaraan"],
            "Properti": ["Rumah Dijual", "Rumah Disewakan / Kontrakan", "Tanah", "Apartemen / Kos-kosan", "Ruko & Komersial"],
            "Pendidikan": ["Buku & Alat Tulis", "Kursus & Bimbel", "Perlengkapan Sekolah", "Seragam"],
            "Bisnis & Grosir": ["Peluang Franchise", "Grosir Sembako", "Perlengkapan Usaha / Toko", "Bahan Baku"],
            "Hobi & Gaya Hidup": ["Olahraga & Outdoor", "Mainan & Koleksi", "Alat Musik", "Hewan Peliharaan", "Seni & Kerajinan"],
            "Produk Digital": ["Pulsa & Paket Data", "Token Listrik & PPOB", "Top-up Game", "Voucher Digital"],
            "Jasa & Layanan": ["Servis Elektronik & Kendaraan", "Desain & IT (Freelance)", "Jasa Fotografi & Video", "Jasa Kebersihan", "Kuliner Pesanan Khusus"],
            "Perjalanan & Wisata": ["Paket Umroh & Haji", "Tiket Transportasi", "Voucher Hotel & Penginapan", "Paket Wisata"],
            "Barang Bekas (Preloved)": ["Pakaian & Aksesoris Bekas", "Elektronik Bekas", "Buku Bekas", "Perabotan Bekas"],
            "Lainnya": ["Lain-lain / Umum"]
        };

        // Fungsi kompresi gambar agar database Firebase tidak penuh
        window.handleImageUpload = function(event, callback) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_SIZE = 400; // Kecilkan ukuran maksimal jadi 400px
                    let w = img.width; let h = img.height;
                    if (w > h) { if (w > MAX_SIZE) { h *= MAX_SIZE / w; w = MAX_SIZE; } } 
                    else { if (h > MAX_SIZE) { w *= MAX_SIZE / h; h = MAX_SIZE; } }
                    canvas.width = w; canvas.height = h;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, w, h);
                    callback(canvas.toDataURL('image/jpeg', 0.7)); // Kompres jadi file JPG 70%
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        // Fungsi merubah pilihan Subkategori otomatis
        window.updateSubCategories = function() {
            const mainCat = document.getElementById('maincat-select').value;
            const subs = window.categoryData[mainCat] || [];
            document.getElementById('subcat-select').innerHTML = subs.map(s => `<option value="${s}">${s}</option>`).join('');
        }

        window.products = [];
        window.cart = [];
        window.myOrders = [];
        window.toastTimeout = null;
        const appId = 'suqna-v1';

        const productsQuery = query(collection(db, 'artifacts', appId, 'public', 'data', 'products'));
        onSnapshot(productsQuery, (snapshot) => {
            window.products = [];
            snapshot.forEach((doc) => {
                window.products.push({ id: doc.id, ...doc.data() });
            });
            window.products.sort((a,b) => (b.timestamp || 0) - (a.timestamp || 0));
            if(window.render) window.render();
        }, (e) => console.error(e));

        signInAnonymously(auth).then((userCredential) => {
            window.userId = userCredential.user.uid;
            
            const profileRef = doc(db, 'artifacts', appId, 'users', window.userId, 'profile', 'store_info');
            onSnapshot(profileRef, (docSnap) => {
                if (docSnap.exists()) {
                    window.storeProfile = docSnap.data();
                    if (window.storeProfile.name && window.storeProfile.name !== "Toko Baru") {
                        window.isStoreUnlocked = true;
                    }
                }
                if(window.render) window.render();
            }, (e) => console.error(e));

            const ordersQuery = query(collection(db, 'artifacts', appId, 'users', window.userId, 'orders'));
            onSnapshot(ordersQuery, (snapshot) => {
                window.myOrders = [];
                snapshot.forEach((doc) => { window.myOrders.push({ id: doc.id, ...doc.data() }); });
                window.myOrders.sort((a,b) => (b.timestamp || 0) - (a.timestamp || 0));
                if(window.render) window.render();
            }, (e) => console.error(e));

        }).catch((e) => console.error("Auth gagal:", e));

        window.render = function() {
            const content = document.getElementById('content');
            const bottomNav = document.getElementById('bottom-nav');
            if(!content) return;
            
            content.classList.add('fade-in');
            setTimeout(() => content.classList.remove('fade-in'), 200);

            if (window.currentView === 'home') {
                content.innerHTML = window.renderHome();
                bottomNav.style.transform = 'translateY(0)';
                content.classList.replace('pb-0', 'pb-24');
                window.startBannerSlide(); 
            } else if (window.currentView === 'detail') {
                content.innerHTML = window.renderProductDetail();
                bottomNav.style.transform = 'translateY(150%)'; 
                content.classList.replace('pb-24', 'pb-0');
                window.stopBannerSlide();
            } else {
                if (window.currentView === 'cart') content.innerHTML = window.renderCart();
                else if (window.currentView === 'account') content.innerHTML = window.renderAccount();
                bottomNav.style.transform = 'translateY(0)'; 
                content.classList.replace('pb-0', 'pb-24');
                window.stopBannerSlide(); 
            }
            
            ['home', 'cart', 'account'].forEach(v => {
                const el = document.getElementById(`nav-${v}`);
                if (!el) return;
                const icon = el.querySelector('i, svg');
                const text = el.querySelector('span');
                if (icon && text) {
                    if(v === window.currentView) {
                        icon.classList.add('text-[#009669]');
                        icon.classList.remove('text-gray-400');
                        text.classList.add('text-[#009669]', 'font-bold');
                        text.classList.remove('text-gray-400', 'font-medium');
                    } else {
                        icon.classList.remove('text-[#009669]');
                        icon.classList.add('text-gray-400');
                        text.classList.remove('text-[#009669]', 'font-bold');
                        text.classList.add('text-gray-400', 'font-medium');
                    }
                }
            });

            const badge = document.getElementById('cart-badge');
            if (badge) {
                if (window.cart.length > 0) {
                    badge.textContent = window.cart.length;
                    badge.classList.remove('hidden');
                } else {
                    badge.classList.add('hidden');
                }
            }
            if(window.lucide) window.lucide.createIcons();
        }

        window.renderHome = function() {
            const b = window.banners[window.currentBannerIndex];
            let html = `
                <div class="bg-[#009669] pt-6 pb-6 px-4 rounded-b-[2rem] shadow-sm relative z-10">
                    <div class="bg-white rounded-full inline-flex items-center px-4 py-2 shadow-md">
                        <img src="https://i.ibb.co.com/CKH6jGp5/ENSIKLOPEDIA-27.png" alt="SUQNA Logo" class="w-7 h-7 mr-2 object-contain drop-shadow-sm">
                        <span class="font-black text-[22px] tracking-tight leading-none pt-0.5">
                            <span class="text-blue-500">S</span><span class="text-rose-500">U</span><span class="text-yellow-500">Q</span><span class="text-emerald-500">N</span><span class="text-purple-500">A</span>
                        </span>
                    </div>

                    <div class="mt-5 bg-white rounded-full flex items-center px-4 py-3 shadow-md focus-within:ring-2 ring-white/50 transition-all">
                        <i data-lucide="search" class="w-5 h-5 text-gray-400 flex-shrink-0"></i>
                        <input type="text" value="${window.currentSearchQuery}" onkeyup="window.handleSearch(this.value)" placeholder="Cari Fashion, Kue, Jasa..." class="flex-1 bg-transparent border-none outline-none text-sm px-3 text-gray-800 placeholder-gray-400 font-medium">
                    </div>

                    <div class="mt-5 relative h-[140px] rounded-2xl overflow-hidden shadow-xl group cursor-pointer border border-white/10" id="banner-container">
                        <img id="banner-img" src="${b.img}" class="w-full h-full object-cover transition-all duration-500" />
                        <div class="absolute inset-0 bg-gradient-to-r from-black/80 via-black/30 to-transparent flex flex-col justify-center px-5">
                            <span id="banner-tag" class="${b.tagColor} font-black text-[10px] tracking-widest uppercase mb-1 drop-shadow-md transition-opacity duration-300">${b.tag}</span>
                            <h3 id="banner-title" class="text-white font-extrabold text-2xl leading-[1.1] drop-shadow-lg transition-opacity duration-300">${b.title}</h3>
                        </div>
                    </div>
                </div>
                
                <div class="px-5 mt-6 mb-8 relative z-0">
                    <div class="flex justify-between items-center mb-5">
                        <h2 class="font-extrabold text-gray-800 text-[17px]">Kategori Pilihan</h2>
                    </div>
                    <div class="grid grid-cols-4 gap-y-6 gap-x-2">
            `;
            
            window.categories.forEach(cat => {
                const isActive = window.currentCategoryFilter === cat.name;
                const ringStyle = isActive ? 'ring-4 ring-[#009669]/30 scale-110' : '';
                html += `
                        <div onclick="window.filterCategory('${cat.name}')" class="flex flex-col items-center cursor-pointer group transition-all">
                            <div class="w-14 h-14 ${cat.bg} ${ringStyle} rounded-[1.1rem] flex items-center justify-center mb-2 shadow-sm">
                                <i data-lucide="${cat.icon}" class="w-6 h-6 ${cat.iconColor}"></i>
                            </div>
                            <span class="text-[10px] ${isActive ? 'font-black text-[#009669]' : cat.textColor} text-center leading-tight px-0.5">${cat.name}</span>
                        </div>
                `;
            });

            html += `
                    </div>
                </div>
                <div class="w-full h-2 bg-gray-100"></div>
                <div class="px-5 mt-6 pb-4">
                    <h2 class="font-extrabold text-gray-800 text-[17px] mb-4" id="recommendation-title">
                        ${window.currentCategoryFilter === 'Semua' ? (window.currentSearchQuery ? 'Hasil Pencarian' : 'Rekomendasi Halal') : `Kategori: ${window.currentCategoryFilter}`}
                    </h2>
                    <div id="product-grid" class="grid grid-cols-2 gap-4">
                        ${window.buildProductGridHTML()}
                    </div>
                </div>`;
            return html;
        }

        window.buildProductGridHTML = function() {
            let filteredProducts = window.products.filter(p => {
                let matchCategory = true;
                if (window.currentCategoryFilter !== 'Semua') {
                    const parentCategoryArray = window.categoryData[window.currentCategoryFilter] || [];
                    matchCategory = parentCategoryArray.includes(p.category) || p.category.includes(window.currentCategoryFilter);
                }
                let matchSearch = true;
                if (window.currentSearchQuery.trim() !== '') {
                    matchSearch = p.name.toLowerCase().includes(window.currentSearchQuery.toLowerCase());
                }
                return matchCategory && matchSearch;
            });

            if (filteredProducts.length === 0) {
                return `<div class="col-span-2 py-10 flex flex-col items-center justify-center text-center">
                        <i data-lucide="search-x" class="w-10 h-10 text-gray-300 mb-2"></i>
                        <h3 class="text-sm font-bold text-gray-600">Barang tidak ditemukan</h3>
                    </div>`;
            }

            return filteredProducts.map(p => `
                <div onclick="window.openProductDetail('${p.id}')" class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden flex flex-col relative cursor-pointer">
                    <div class="h-32 bg-gray-50 relative">
                        <img src="${p.imgUrl}" alt="${p.name}" class="w-full h-full object-cover"/>
                        <div class="absolute top-2 left-2 bg-white/90 backdrop-blur-sm text-[#009669] text-[8px] font-extrabold px-2 py-1 rounded-full uppercase shadow-sm max-w-[90%] truncate">${p.category}</div>
                    </div>
                    <div class="p-3 flex flex-col flex-1">
                        <h3 class="font-semibold text-sm text-gray-800 leading-tight mb-2 line-clamp-2">${p.name}</h3>
                        <div class="flex items-center gap-1.5 mb-2">
                            <i data-lucide="store" class="w-3.5 h-3.5 text-gray-400"></i>
                            <span class="text-[10px] font-medium text-gray-500 truncate">${p.storeName}</span>
                        </div>
                        <div class="mt-auto">
                            <p class="text-[#009669] font-black text-sm mb-3">Rp ${p.price.toLocaleString('id-ID')}</p>
                            <button onclick="event.stopPropagation(); window.addToCart('${p.id}')" class="w-full bg-[#009669]/10 text-[#009669] py-2 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5">
                                <i data-lucide="shopping-bag" class="w-3.5 h-3.5"></i> Beli
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        window.renderProductDetail = function() {
            const p = window.currentProductDetail;
            if(!p) return '';
            const inCart = window.cart.some(item => item.id === p.id);

            return `
                <div class="relative w-full h-[350px] bg-gray-100">
                    <button onclick="window.navigate('home')" class="absolute top-6 left-4 z-20 w-10 h-10 bg-white/80 rounded-full shadow-md flex items-center justify-center text-gray-800">
                        <i data-lucide="arrow-left" class="w-5 h-5"></i>
                    </button>
                    <img src="${p.imgUrl}" alt="${p.name}" class="w-full h-full object-cover">
                </div>
                <div class="bg-white -mt-5 relative z-10 rounded-t-3xl px-5 pt-6 pb-28 shadow-lg">
                    <h1 class="text-xl font-extrabold text-gray-900 leading-tight mb-2">${p.name}</h1>
                    <p class="text-[#009669] font-black text-2xl mb-4">Rp ${p.price.toLocaleString('id-ID')}</p>
                    <div class="w-full h-[1px] bg-gray-100 mb-5"></div>
                    <div class="flex items-center gap-3 mb-5 p-3 rounded-2xl bg-gray-50">
                        <div class="w-12 h-12 bg-white rounded-full flex items-center justify-center shadow-sm">
                            <span class="text-[#009669] font-black text-lg uppercase">${p.storeName.charAt(0)}</span>
                        </div>
                        <div class="flex-1">
                            <h3 class="font-bold text-gray-800 text-sm">${p.storeName}</h3>
                            <p class="text-[10px] text-gray-500">Aktif baru saja</p>
                        </div>
                    </div>
                    <h3 class="font-extrabold text-gray-900 text-[15px] mb-3">Deskripsi</h3>
                    <p class="text-sm text-gray-600">${p.description || "Produk berkualitas terbaik."}</p>
                </div>
                <div class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white p-4 shadow-lg z-50 rounded-t-3xl flex gap-3">
                    <button onclick="window.addToCart('${p.id}'); window.navigate('cart');" class="flex-1 bg-[#009669] text-white font-extrabold py-4 rounded-2xl flex justify-center items-center">
                        Beli Sekarang
                    </button>
                </div>
            `;
        }

        window.renderCart = function() {
            if (window.cart.length === 0) {
                return `<div class="flex flex-col items-center justify-center pt-32 text-gray-400">Keranjang Kosong</div>`;
            }
            let total = window.cart.reduce((s, i) => s + i.price, 0);
            return `
                <div class="bg-[#009669] pt-12 pb-6 px-5 rounded-b-[2rem] text-white font-extrabold text-2xl">Keranjang</div>
                <div class="px-5 mt-6 pb-40 space-y-4">
                    ${window.cart.map((item, index) => `
                        <div class="flex justify-between items-center bg-white p-3 rounded-2xl shadow-sm border border-gray-100">
                            <div class="flex items-center gap-4">
                                <img src="${item.imgUrl}" class="w-16 h-16 rounded-xl object-cover"/>
                                <div><h4 class="font-bold text-sm">${item.name}</h4><p class="text-[#009669] text-sm font-black">Rp ${item.price.toLocaleString('id-ID')}</p></div>
                            </div>
                            <button onclick="window.removeFromCart(${index})" class="text-red-400 p-2"><i data-lucide="trash-2" class="w-5 h-5"></i></button>
                        </div>
                    `).join('')}
                </div>
                <div class="fixed sm:absolute bottom-[4.5rem] w-full bg-white p-5 shadow-lg z-10 rounded-t-3xl">
                    <div class="flex justify-between mb-4"><span class="font-bold text-gray-500">Total</span><span class="text-[#009669] text-xl font-black">Rp ${total.toLocaleString('id-ID')}</span></div>
                    <button onclick="window.processCheckout()" class="w-full bg-[#009669] text-white font-bold py-4 rounded-2xl">Checkout Sekarang</button>
                </div>`;
        }

        window.renderAccount = function() {
            if (window.role === 'buyer') {
                return `
                    <div class="bg-[#009669] pt-10 pb-14 px-5 rounded-b-[2rem] shadow-sm relative z-0">
                        <h2 class="text-[22px] font-extrabold text-white mb-6">Akun Pembeli</h2>
                        <div class="flex items-center gap-4">
                            <div class="w-16 h-16 bg-white rounded-full flex items-center justify-center shadow-lg"><i data-lucide="user" class="w-8 h-8 text-[#009669]"></i></div>
                            <div>
                                <h3 class="text-white font-extrabold text-xl">Pengguna SUQNA</h3>
                                <p class="text-emerald-100 text-[11px] font-medium">ID: ${window.userId ? window.userId.substring(0,6).toUpperCase() : '...'}</p>
                            </div>
                        </div>
                    </div>
                    
                    <div class="px-5 -mt-6 relative z-10 pb-24 space-y-4">
                        <!-- PENTING: Tombol Akses Toko dipindah ke Atas agar tidak tersembunyi -->
                        <button onclick="window.toggleRole()" class="w-full bg-emerald-50 border border-emerald-100 text-[#009669] font-extrabold py-4 rounded-2xl flex justify-between items-center px-5 shadow-sm">
                            <div class="flex items-center gap-2"><i data-lucide="store" class="w-5 h-5"></i> Akses Toko Saya</div>
                            <i data-lucide="chevron-right" class="w-5 h-5"></i>
                        </button>

                        <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-4">
                            <h3 class="font-extrabold text-gray-900 text-[13px] mb-3">Pesanan Saya</h3>
                            <div class="flex justify-between items-center px-1">
                                <div class="flex flex-col items-center gap-1.5"><i data-lucide="wallet" class="w-6 h-6 text-gray-400"></i><span class="text-[10px] text-gray-500">Belum Bayar</span></div>
                                <div class="flex flex-col items-center gap-1.5 relative">
                                    <div class="absolute -top-1 -right-1 bg-red-500 w-2.5 h-2.5 rounded-full border border-white ${window.myOrders.length > 0 ? '' : 'hidden'}"></div>
                                    <i data-lucide="package" class="w-6 h-6 text-gray-400"></i><span class="text-[10px] text-gray-500">Dikemas</span>
                                </div>
                                <div class="flex flex-col items-center gap-1.5"><i data-lucide="truck" class="w-6 h-6 text-gray-400"></i><span class="text-[10px] text-gray-500">Dikirim</span></div>
                            </div>
                        </div>
                    </div>
                `;
            } else {
                return window.renderStore();
            }
        }

        window.renderStore = function() {
            if (!window.isStoreUnlocked) {
                // Form Registrasi / Login Toko
                return `
                    <div class="flex flex-col items-center justify-center min-h-full pt-6 px-5 pb-24 bg-gray-50/30 relative">
                        <button onclick="window.role='buyer'; window.render();" class="absolute top-6 left-5 w-10 h-10 bg-white rounded-full flex items-center justify-center text-gray-500 shadow-sm border border-gray-100 z-20 hover:bg-gray-50 transition-colors">
                            <i data-lucide="arrow-left" class="w-5 h-5"></i>
                        </button>
                        <div class="bg-white rounded-[2rem] p-7 w-full shadow-lg text-center mt-12">
                            <div class="w-16 h-16 bg-[#009669]/10 text-[#009669] rounded-full flex items-center justify-center mx-auto mb-4">
                                <i data-lucide="store" class="w-7 h-7"></i>
                            </div>
                            <h3 class="font-extrabold text-[22px] text-gray-900 mb-6">Buka Toko Baru</h3>
                            <input type="text" id="reg-store-name" placeholder="Nama Toko (Cth: Warung Bu Siti)" class="w-full bg-gray-50 border border-gray-200 text-sm rounded-2xl px-4 py-3.5 mb-4 focus:ring-1 focus:ring-[#009669]">
                            <button onclick="window.registerNewStore()" class="w-full bg-[#009669] text-white font-extrabold py-3.5 rounded-2xl shadow-lg">
                                Buka Toko
                            </button>
                        </div>
                    </div>`;
            }

            // Ambil daftar Utama untuk Pilihan Select
            let catOptions = Object.keys(window.categoryData).map(c => `<option value="${c}">${c}</option>`).join('');

            return `
                <div class="bg-[#009669] pt-10 pb-14 px-5 rounded-b-[2rem] shadow-sm relative z-0">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-[22px] font-extrabold text-white">Dashboard Toko</h2>
                        <div class="flex gap-2">
                            <button onclick="window.toggleEditProfile()" class="w-9 h-9 bg-white/20 rounded-full text-white flex items-center justify-center shadow-sm hover:bg-white/30"><i data-lucide="pencil" class="w-4 h-4"></i></button>
                            <button onclick="window.role='buyer'; window.render();" class="w-9 h-9 bg-white/20 rounded-full text-white flex items-center justify-center shadow-sm hover:bg-white/30"><i data-lucide="arrow-left" class="w-4 h-4"></i></button>
                        </div>
                    </div>
                    <div class="flex items-center gap-4">
                        <div class="w-16 h-16 bg-white rounded-full flex items-center justify-center shadow-lg overflow-hidden border-2 border-white/50">
                            ${window.storeProfile.avatar ? `<img src="${window.storeProfile.avatar}" class="w-full h-full object-cover">` : `<span class="text-[#009669] text-2xl font-black uppercase">${window.storeProfile.name.charAt(0)}</span>`}
                        </div>
                        <div><h3 class="text-white font-extrabold text-xl">${window.storeProfile.name}</h3></div>
                    </div>
                </div>

                <div class="px-5 -mt-6 relative z-10 pb-24">
                    ${window.isEditingProfile ? `
                        <button onclick="window.toggleEditProfile()" class="w-full bg-white border-2 border-[#009669] text-[#009669] font-extrabold py-3.5 rounded-2xl mb-6 shadow-sm">Batal Edit</button>
                        <div class="bg-white rounded-2xl border border-gray-100 p-5 shadow-sm space-y-4 flex flex-col items-center">
                            
                            <!-- Upload Logo Toko -->
                            <div class="relative w-24 h-24 mb-2 group cursor-pointer" onclick="document.getElementById('avatar-upload').click()">
                                <div class="w-full h-full rounded-full overflow-hidden border-4 border-gray-100 shadow-sm bg-gray-50 flex items-center justify-center">
                                    <img id="edit-avatar-preview" src="${window.tempUploadedAvatar || window.storeProfile.avatar || `https://placehold.co/100x100/e2e8f0/64748b?text=${window.storeProfile.name.charAt(0)}`}" class="w-full h-full object-cover">
                                </div>
                                <div class="absolute bottom-0 right-0 bg-[#009669] p-2 rounded-full border-2 border-white text-white shadow-md">
                                    <i data-lucide="camera" class="w-3.5 h-3.5"></i>
                                </div>
                            </div>
                            <input type="file" id="avatar-upload" class="hidden" accept="image/*" onchange="window.handleImageUpload(event, (url) => { window.tempUploadedAvatar = url; document.getElementById('edit-avatar-preview').src = url; })">
                            <span class="text-[11px] text-gray-400 mb-2 font-medium">Sentuh logo untuk mengubah</span>

                            <input type="text" id="edit-store-name" value="${window.storeProfile.name}" placeholder="Nama Toko Baru" class="w-full bg-gray-50 border border-gray-100 rounded-xl px-4 py-3 font-bold text-gray-800 text-center text-lg focus:ring-2 focus:ring-[#009669]/20 outline-none transition-all">
                            <button onclick="window.saveProfile()" class="w-full bg-[#009669] text-white font-extrabold py-3.5 rounded-2xl mt-4 shadow-lg shadow-emerald-200">Simpan Profil</button>
                        </div>
                    ` : !window.isAddingProduct ? `
                        <button onclick="window.toggleAddProduct()" class="w-full bg-white border border-[#009669] text-[#009669] font-extrabold py-3.5 rounded-2xl mb-8 flex justify-center items-center gap-2 shadow-sm">
                            <i data-lucide="plus" class="w-5 h-5"></i> Tambah Dagangan Baru
                        </button>
                        <div class="flex items-center gap-2 mb-4"><h3 class="font-extrabold text-gray-900 text-lg">Etalase Anda</h3></div>
                        <div class="grid grid-cols-2 gap-4">
                            ${window.products.filter(p => p.ownerId === window.userId).map(p => `
                                <div class="bg-white rounded-2xl shadow-sm border border-gray-100 relative overflow-hidden group">
                                    <button onclick="window.deleteProduct('${p.id}')" class="absolute top-2 right-2 z-10 bg-white/90 backdrop-blur text-red-500 p-1.5 rounded-full shadow-sm opacity-90 hover:opacity-100 transition-opacity"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
                                    <img src="${p.imgUrl}" class="h-28 w-full object-cover">
                                    <div class="p-3">
                                        <div class="text-[8px] font-bold text-[#009669] bg-emerald-50 inline-block px-1.5 py-0.5 rounded-md mb-1.5 truncate max-w-full">${p.category}</div>
                                        <h3 class="font-semibold text-xs leading-tight mb-1 line-clamp-1 text-gray-800">${p.name}</h3>
                                        <p class="text-[#009669] font-black text-xs">Rp ${p.price.toLocaleString('id-ID')}</p>
                                    </div>
                                </div>
                            `).join('')}
                            ${window.products.filter(p => p.ownerId === window.userId).length === 0 ? '<div class="col-span-2 text-center py-6 text-gray-400 text-sm">Etalase Anda masih kosong.</div>' : ''}
                        </div>
                    ` : `
                        <button onclick="window.toggleAddProduct()" class="w-full bg-white border-2 border-[#009669] text-[#009669] font-extrabold py-3.5 rounded-2xl mb-6 shadow-sm">Batal Tambah</button>
                        <div class="bg-white rounded-2xl border border-gray-100 p-5 shadow-sm space-y-4">
                            
                            <!-- Upload Foto Produk -->
                            <div class="w-full h-32 bg-gray-50 hover:bg-gray-100 transition-colors border-2 border-dashed border-gray-300 rounded-xl flex flex-col items-center justify-center cursor-pointer overflow-hidden relative group" onclick="document.getElementById('prod-img-upload').click()">
                                <img id="new-prod-preview" src="" class="w-full h-full object-cover hidden absolute inset-0 z-10">
                                <i data-lucide="image-plus" class="w-8 h-8 text-gray-400 group-hover:text-[#009669] mb-2 relative z-0 transition-colors"></i>
                                <span class="text-xs text-gray-500 font-medium relative z-0">Unggah Foto Barang</span>
                            </div>
                            <input type="file" id="prod-img-upload" class="hidden" accept="image/*" onchange="window.handleImageUpload(event, (url) => { window.tempProductImg = url; const img = document.getElementById('new-prod-preview'); img.src = url; img.classList.remove('hidden'); })">

                            <input type="text" id="new-prod-name" placeholder="Nama Barang (Cth: Madu Hutan Asli)" class="w-full bg-gray-50 border border-gray-100 rounded-xl px-4 py-3 font-medium text-gray-800 focus:ring-2 focus:ring-[#009669]/20 outline-none transition-all">
                            
                            <div class="relative">
                                <span class="absolute left-4 top-3.5 text-gray-500 font-bold text-sm">Rp</span>
                                <input type="number" id="new-prod-price" placeholder="Harga" class="w-full bg-gray-50 border border-gray-100 rounded-xl pl-11 pr-4 py-3 font-bold text-gray-800 focus:ring-2 focus:ring-[#009669]/20 outline-none transition-all">
                            </div>

                            <div class="grid grid-cols-2 gap-3">
                                <div>
                                    <label class="text-[10px] text-gray-500 font-bold ml-1 mb-1 block">Kategori Utama</label>
                                    <select id="maincat-select" onchange="window.updateSubCategories()" class="w-full bg-gray-50 border border-gray-100 rounded-xl px-2 py-3 text-xs text-gray-700 font-medium focus:ring-2 focus:ring-[#009669]/20 outline-none">
                                        <option value="" disabled selected>Pilih Kategori...</option>
                                        ${catOptions}
                                    </select>
                                </div>
                                <div>
                                    <label class="text-[10px] text-gray-500 font-bold ml-1 mb-1 block">Subkategori</label>
                                    <select id="subcat-select" class="w-full bg-gray-50 border border-gray-100 rounded-xl px-2 py-3 text-xs text-gray-700 font-medium focus:ring-2 focus:ring-[#009669]/20 outline-none">
                                        <option value="" disabled selected>-</option>
                                    </select>
                                </div>
                            </div>

                            <textarea id="new-prod-desc" placeholder="Tuliskan deskripsi lengkap, bahan, atau garansi..." rows="3" class="w-full bg-gray-50 border border-gray-100 rounded-xl px-4 py-3 font-medium text-gray-800 text-sm focus:ring-2 focus:ring-[#009669]/20 outline-none transition-all"></textarea>

                            <button onclick="window.saveProduct()" class="w-full bg-[#009669] text-white font-extrabold py-3.5 rounded-2xl mt-2 shadow-lg shadow-emerald-200">Tayangkan di Pasar</button>
                        </div>
                    `}
                </div>
            `;
        }

        window.navigate = function(view) { window.currentView = view; window.render(); }
        window.filterCategory = function(c) { window.currentCategoryFilter = c; window.render(); }
        window.handleSearch = function(q) { window.currentSearchQuery = q; window.render(); }
        window.openProductDetail = function(id) { window.currentProductDetail = window.products.find(p=>p.id===id); window.navigate('detail'); }
        window.addToCart = function(id) { 
            const p = window.products.find(p=>p.id===id); 
            if(p){ window.cart.push(p); window.showToastMessage('Ditambahkan ke keranjang'); window.render(); }
        }
        window.removeFromCart = function(i) { window.cart.splice(i,1); window.render(); }
        
        window.toggleRole = function() {
            window.role = window.role === 'buyer' ? 'seller' : 'buyer';
            window.render();
        }

        window.registerNewStore = function() {
            const nameInput = document.getElementById('reg-store-name').value;
            if(nameInput) {
                window.storeProfile.name = nameInput;
                if(window.userId) setDoc(doc(db, 'artifacts', appId, 'users', window.userId, 'profile', 'store_info'), window.storeProfile);
                window.isStoreUnlocked = true;
                window.render();
            }
        }
        
        window.toggleAddProduct = function() { window.isAddingProduct = !window.isAddingProduct; window.render(); }
        window.toggleEditProfile = function() { window.isEditingProfile = !window.isEditingProfile; window.render(); }

        window.saveProfile = async function() {
            const newName = document.getElementById('edit-store-name').value;
            if(newName) {
                window.storeProfile.name = newName;
                // Update logo jika ada foto baru yang diunggah
                if(window.tempUploadedAvatar) {
                    window.storeProfile.avatar = window.tempUploadedAvatar;
                }
                if(window.userId) await setDoc(doc(db, 'artifacts', appId, 'users', window.userId, 'profile', 'store_info'), window.storeProfile);
                window.isEditingProfile = false;
                window.tempUploadedAvatar = ''; // Bersihkan memori foto
                window.showToastMessage('Profil Toko Diperbarui!');
                window.render();
            }
        }

        window.saveProduct = async function() {
            const name = document.getElementById('new-prod-name').value;
            const price = parseInt(document.getElementById('new-prod-price').value) || 0;
            const subcat = document.getElementById('subcat-select').value;
            const desc = document.getElementById('new-prod-desc').value;
            
            // Validasi: Pastikan nama, harga, dan subkategori telah diisi!
            if(name && price && subcat) {
                // Gunakan foto yang diunggah, atau otomatis bikin placeholder warna hijau
                const finalImgUrl = window.tempProductImg || `https://placehold.co/400x400/009669/ffffff?text=${name.substring(0,2).toUpperCase()}`;
                
                const p = {
                    name: name, price: price, category: subcat, description: desc,
                    storeName: window.storeProfile.name, ownerId: window.userId,
                    imgUrl: finalImgUrl,
                    timestamp: Date.now()
                };
                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'products'), p);
                window.isAddingProduct = false;
                window.tempProductImg = ''; // Bersihkan memori foto produk
                window.showToastMessage('Barang Berhasil Ditambahkan');
                window.render();
            } else {
                window.showToastMessage('Gagal: Isi Nama, Harga & Kategori!');
            }
        }

        window.deleteProduct = async function(id) {
            await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'products', id));
        }

        window.processCheckout = async function() {
            if(window.cart.length > 0 && window.userId) {
                const order = { items: window.cart, totalAmount: window.cart.reduce((s,i)=>s+i.price,0), status: 'Dikemas', timestamp: Date.now() };
                await addDoc(collection(db, 'artifacts', appId, 'users', window.userId, 'orders'), order);
                window.cart = [];
                window.showModal('Pesanan Berhasil', 'Pesanan masuk ke aktivitas.');
                window.navigate('account');
            }
        }
        
        window.showToastMessage = function(m) {
            const t = document.getElementById('toast'); t.innerText = m;
            t.classList.remove('hidden'); t.classList.add('animate-bounce');
            clearTimeout(window.toastTimeout);
            window.toastTimeout = setTimeout(() => { t.classList.add('hidden'); }, 2500);
        }
        
        window.showModal = function(title, desc) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-desc').innerText = desc;
            document.getElementById('modal').classList.remove('hidden');
        }

        window.closeModal = function() { document.getElementById('modal').classList.add('hidden'); }

        window.startBannerSlide = function() {
            clearInterval(window.bannerInterval);
            window.bannerInterval = setInterval(() => {
                window.currentBannerIndex = (window.currentBannerIndex + 1) % window.banners.length;
                const b = window.banners[window.currentBannerIndex];
                const img = document.getElementById('banner-img');
                const title = document.getElementById('banner-title');
                if(img) {
                    img.style.opacity = 0;
                    setTimeout(() => { img.src = b.img; title.innerHTML = b.title; img.style.opacity = 1; }, 300);
                }
            }, 3500);
        }
        window.stopBannerSlide = function() { clearInterval(window.bannerInterval); }
        
        window.render();
    </script>
</body>
</html>
