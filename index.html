<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HalalMall - Web App</title>
    <!-- Memuat Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Memuat Ikon Lucide -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-200 text-gray-800 font-sans flex justify-center">

    <!-- Kontainer Utama (Mengunci ukuran agar persis seperti layar HP) -->
    <div id="app" class="w-full max-w-md mx-auto bg-gray-50 min-h-screen relative shadow-2xl overflow-hidden font-sans">
        
        <!-- Notifikasi (Toast) -->
        <div id="toast" class="hidden absolute top-20 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-4 py-2 rounded-full text-sm font-medium z-50 shadow-xl transition-all">
        </div>

        <!-- Header -->
        <header class="bg-green-600 text-white p-4 flex justify-between items-center shadow-md z-10 relative">
            <div class="flex items-center gap-2">
                <i data-lucide="store" class="w-6 h-6"></i>
                <h1 class="text-xl font-bold tracking-wide">HalalMall</h1>
            </div>
            <button onclick="toggleRole()" id="roleBtn" class="text-xs bg-green-700 hover:bg-green-800 transition px-3 py-1.5 rounded-full font-medium border border-green-500">
                Mode: Pembeli
            </button>
        </header>

        <!-- Area Konten Utama -->
        <main id="content" class="p-4 h-[calc(100vh-8rem)] overflow-y-auto">
            <!-- Isi layar akan berubah-ubah di sini -->
        </main>

        <!-- Navigasi Bawah -->
        <nav class="absolute bottom-0 w-full bg-white border-t border-gray-200 flex justify-around p-2 text-gray-400 shadow-[0_-2px_10px_rgba(0,0,0,0.05)] z-10">
            <button onclick="navigate('home')" id="nav-home" class="flex flex-col items-center p-2 transition-colors w-16">
                <i data-lucide="home" class="w-6 h-6 mb-1"></i>
                <span class="text-[10px] font-medium">Beranda</span>
            </button>
            <button onclick="navigate('cart')" id="nav-cart" class="flex flex-col items-center p-2 transition-colors w-16 relative">
                <div id="cart-badge" class="hidden absolute top-1 right-2 bg-red-500 text-white text-[9px] font-bold w-4 h-4 flex items-center justify-center rounded-full">0</div>
                <i data-lucide="shopping-cart" class="w-6 h-6 mb-1"></i>
                <span class="text-[10px] font-medium">Keranjang</span>
            </button>
            <button onclick="navigate('store')" id="nav-store" class="flex flex-col items-center p-2 transition-colors w-16">
                <i data-lucide="layout-dashboard" class="w-6 h-6 mb-1"></i>
                <span class="text-[10px] font-medium">Toko</span>
            </button>
        </nav>
    </div>

    <!-- Skrip Logika Aplikasi -->
    <script>
        let currentView = 'home';
        let role = 'buyer'; 
        
        const products = [
            { id: 1, name: "Kurma Ajwa Premium", price: 120000, category: "Makanan", stock: 15 },
            { id: 2, name: "Madu Hutan Liar", price: 85000, category: "Minuman", stock: 5 },
            { id: 3, name: "Saffron Khasmir", price: 250000, category: "Kesehatan", stock: 2 },
            { id: 4, name: "Minyak Zaitun Extra", price: 65000, category: "Kesehatan", stock: 10 }
        ];
        
        let cart = [];
        let toastTimeout;

        // Inisialisasi ikon
        lucide.createIcons();

        function render() {
            const content = document.getElementById('content');
            
            if (currentView === 'home') content.innerHTML = renderHome();
            else if (currentView === 'cart') content.innerHTML = renderCart();
            else if (currentView === 'store') content.innerHTML = renderStore();
            
            // Ganti warna menu navigasi yang aktif
            ['home', 'cart', 'store'].forEach(v => {
                const el = document.getElementById(`nav-${v}`);
                if(v === currentView) {
                    el.classList.add('text-green-600');
                    el.classList.remove('text-gray-400', 'hover:text-green-600');
                } else {
                    el.classList.remove('text-green-600');
                    el.classList.add('text-gray-400', 'hover:text-green-600');
                }
            });

            // Perbarui lencana (angka) keranjang
            const badge = document.getElementById('cart-badge');
            if (cart.length > 0) {
                badge.textContent = cart.length;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }

            // Muat ulang ikon setiap kali layar berganti
            lucide.createIcons();
        }

        function renderHome() {
            let html = `
                <div class="pb-24">
                    <div class="mb-5 bg-green-100 p-4 rounded-xl border border-green-200">
                        <h2 class="text-green-800 font-bold text-lg">Selamat Datang!</h2>
                        <p class="text-green-600 text-sm mt-1">Temukan produk halal terbaik hari ini.</p>
                    </div>
                    <h3 class="font-bold text-gray-800 mb-3 flex items-center gap-2">
                        <i data-lucide="sparkles" class="w-5 h-5 text-yellow-500"></i> Rekomendasi
                    </h3>
                    <div class="grid grid-cols-2 gap-3">
            `;
            
            products.forEach(p => {
                html += `
                    <div class="bg-white p-3 rounded-xl shadow-sm border border-gray-100 flex flex-col justify-between">
                        <div>
                            <div class="h-28 bg-gray-100 rounded-lg mb-3 flex flex-col items-center justify-center text-gray-400">
                                <i data-lucide="image" class="w-8 h-8 opacity-50 mb-1"></i>
                            </div>
                            <span class="text-[10px] bg-gray-100 text-gray-600 px-2 py-1 rounded mb-2 inline-block">${p.category}</span>
                            <h3 class="font-bold text-sm text-gray-800 leading-tight mb-1">${p.name}</h3>
                            <p class="text-green-600 font-extrabold text-sm mb-3">Rp ${p.price.toLocaleString('id-ID')}</p>
                        </div>
                        <button onclick="addToCart(${p.id})" class="w-full bg-green-50 text-green-700 border border-green-200 py-1.5 rounded-lg text-xs font-bold hover:bg-green-600 hover:text-white transition-colors flex items-center justify-center gap-1">
                            <i data-lucide="plus" class="w-4 h-4"></i> Beli
                        </button>
                    </div>
                `;
            });
            html += `</div></div>`;
            return html;
        }

        function renderCart() {
            if (cart.length === 0) {
                return `
                    <div class="flex flex-col items-center justify-center h-full text-gray-400 pt-20">
                        <div class="bg-gray-100 p-4 rounded-full mb-3">
                            <i data-lucide="shopping-cart" class="w-12 h-12 text-gray-300"></i>
                        </div>
                        <p class="font-medium text-gray-500">Keranjang masih kosong</p>
                        <button onclick="navigate('home')" class="mt-4 text-green-600 text-sm font-bold">Mulai Belanja</button>
                    </div>`;
            }
            
            let total = 0;
            let html = `<div class="pb-32"><h2 class="text-xl font-bold mb-4 text-gray-800">Keranjang Belanja</h2><div class="space-y-3">`;
            
            cart.forEach((item, index) => {
                total += item.price;
                html += `
                    <div class="flex justify-between items-center bg-white p-3 rounded-xl shadow-sm border border-gray-100">
                        <div class="flex items-center gap-3">
                            <div class="w-12 h-12 bg-gray-100 rounded flex items-center justify-center">
                                <i data-lucide="package" class="text-gray-400 w-5 h-5"></i>
                            </div>
                            <div>
                                <h4 class="font-bold text-sm text-gray-800">${item.name}</h4>
                                <p class="text-green-600 text-sm font-semibold">Rp ${item.price.toLocaleString('id-ID')}</p>
                            </div>
                        </div>
                        <button onclick="removeFromCart(${index})" class="text-red-400 hover:text-red-600 p-2 bg-red-50 rounded-lg">
                            <i data-lucide="trash-2" class="w-5 h-5"></i>
                        </button>
                    </div>
                `;
            });

            html += `</div></div>
                <div class="absolute bottom-16 left-0 right-0 bg-white border-t border-gray-200 p-4 shadow-[0_-10px_15px_-3px_rgba(0,0,0,0.05)]">
                    <div class="flex justify-between font-bold text-gray-800 mb-3">
                        <span>Total Pembayaran:</span>
                        <span class="text-green-600 text-lg">Rp ${total.toLocaleString('id-ID')}</span>
                    </div>
                    <button onclick="checkout()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-xl shadow-lg transition flex justify-center items-center gap-2">
                        Checkout Sekarang <i data-lucide="arrow-right" class="w-5 h-5"></i>
                    </button>
                </div>
            `;
            return html;
        }

        function renderStore() {
            if (role !== 'seller') {
                return `
                    <div class="flex flex-col items-center justify-center h-full text-center pt-16 px-4">
                        <div class="bg-blue-50 p-5 rounded-full mb-4">
                            <i data-lucide="store" class="w-16 h-16 text-blue-300"></i>
                        </div>
                        <h3 class="font-bold text-xl text-gray-800 mb-2">Buka Toko Halal Anda</h3>
                        <p class="text-sm text-gray-500 mb-6 leading-relaxed">Jangkau ribuan pembeli dan kelola bisnis Anda dengan mudah di platform HalalMall.</p>
                        <button onclick="toggleRole()" class="bg-green-600 text-white font-bold px-6 py-3 rounded-xl shadow-md hover:bg-green-700 w-full">Daftar Jadi Penjual (Gratis)</button>
                    </div>`;
            }

            return `
                <div class="pb-24">
                    <div class="flex justify-between items-center mb-5">
                        <h2 class="text-xl font-bold text-gray-800">Dashboard Toko</h2>
                        <span class="bg-blue-100 text-blue-700 text-xs px-2 py-1 rounded font-bold">Penjual Aktif</span>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-3 mb-5">
                        <div class="bg-white p-4 rounded-xl border border-gray-100 shadow-sm">
                            <p class="text-xs text-gray-500 font-medium mb-1">Total Pendapatan</p>
                            <p class="text-lg font-black text-green-600">Rp 0</p>
                        </div>
                        <div class="bg-white p-4 rounded-xl border border-gray-100 shadow-sm">
                            <p class="text-xs text-gray-500 font-medium mb-1">Pesanan Aktif</p>
                            <p class="text-lg font-black text-blue-600">0</p>
                        </div>
                    </div>

                    <h3 class="font-bold text-gray-800 mb-3 text-sm">Produk Anda</h3>
                    
                    <button class="w-full border-2 border-dashed border-green-300 bg-green-50 text-green-700 font-bold py-4 rounded-xl flex flex-col items-center justify-center gap-2 hover:bg-green-100 transition mb-4">
                        <i data-lucide="plus-circle" class="w-6 h-6"></i>
                        <span>Tambah Produk Baru</span>
                    </button>
                </div>
            `;
        }

        function navigate(view) {
            currentView = view;
            render();
        }

        function toggleRole() {
            role = role === 'buyer' ? 'seller' : 'buyer';
            document.getElementById('roleBtn').innerText = role === 'buyer' ? 'Mode: Pembeli' : 'Mode: Penjual';
            
            if (role === 'seller' && currentView !== 'store') {
                navigate('store');
            } else if (role === 'buyer' && currentView === 'store') {
                navigate('home');
            } else {
                render();
            }
        }

        function addToCart(id) {
            const product = products.find(p => p.id === id);
            if(product) {
                cart.push(product);
                render();
                showToastMessage(`\${product.name} ditambahkan!`);
            }
        }
        
        function showToastMessage(message) {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.classList.remove('hidden');
            
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.add('hidden');
            }, 2000);
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            render();
        }

        function checkout() {
            alert('Fitur Pembayaran Sedang Diproses! Terima kasih telah berbelanja.');
            cart = [];
            navigate('home');
        }

        render();
    </script>
</body>
</html>
