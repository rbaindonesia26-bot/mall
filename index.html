<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HalalMall - Web App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Sembunyikan scrollbar untuk tampilan mirip aplikasi asli */
        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }
        body {
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body class="bg-gray-200 text-gray-800 font-sans flex justify-center min-h-screen items-center">

    <div id="app" class="w-full max-w-md h-[100dvh] sm:h-[90vh] mx-auto bg-white relative shadow-2xl sm:rounded-[2.5rem] sm:border-8 border-gray-800 overflow-hidden flex flex-col">
        
        <!-- Notifikasi (Toast) -->
        <div id="toast" class="hidden absolute top-24 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-5 py-2.5 rounded-full text-xs font-bold z-[100] shadow-2xl transition-all whitespace-nowrap">
        </div>

        <!-- Custom Modal untuk Checkout -->
        <div id="modal" class="hidden absolute inset-0 bg-black/60 z-[100] flex items-center justify-center p-4 backdrop-blur-sm transition-opacity">
            <div class="bg-white rounded-3xl p-6 max-w-[85%] w-full text-center shadow-2xl transform scale-100 transition-transform">
                <div class="w-16 h-16 bg-[#009669]/10 text-[#009669] rounded-full flex items-center justify-center mx-auto mb-4">
                    <i data-lucide="check-circle" class="w-8 h-8"></i>
                </div>
                <h3 id="modal-title" class="text-xl font-bold text-gray-800 mb-2">Sukses</h3>
                <p id="modal-desc" class="text-sm text-gray-600 mb-6">Operasi berhasil dilakukan.</p>
                <button onclick="closeModal()" class="w-full bg-[#009669] text-white font-bold py-3.5 rounded-xl hover:bg-emerald-700 transition-colors shadow-lg shadow-emerald-200">
                    Selesai
                </button>
            </div>
        </div>

        <!-- Area Konten Utama (Scrollable) -->
        <main id="content" class="flex-1 overflow-y-auto pb-24 relative bg-white">
            <!-- Isi layar (Beranda, Keranjang, Toko) akan dirender di sini via JS -->
        </main>

        <nav class="absolute bottom-0 w-full bg-white border-t border-gray-100 flex justify-between px-6 pt-3 pb-4 shadow-[0_-10px_30px_rgba(0,0,0,0.04)] z-50 pb-safe">
            <button onclick="navigate('home')" id="nav-home" class="flex flex-col items-center gap-1.5 transition-colors w-16 group">
                <i data-lucide="home" class="w-6 h-6 text-[#009669] group-active:scale-95 transition-transform"></i>
                <span class="text-[10px] font-bold text-[#009669]">Beranda</span>
            </button>
            <button onclick="navigate('cart')" id="nav-cart" class="flex flex-col items-center gap-1.5 transition-colors w-16 relative group">
                <div id="cart-badge" class="hidden absolute -top-1 right-2 bg-red-500 text-white text-[9px] font-bold w-4 h-4 flex items-center justify-center rounded-full shadow-sm border-2 border-white">0</div>
                <i data-lucide="shopping-cart" class="w-6 h-6 text-gray-400 group-hover:text-gray-600 group-active:scale-95 transition-all"></i>
                <span class="text-[10px] font-medium text-gray-400">Keranjang</span>
            </button>
            <button onclick="navigate('store')" id="nav-store" class="flex flex-col items-center gap-1.5 transition-colors w-16 group">
                <i data-lucide="store" class="w-6 h-6 text-gray-400 group-hover:text-gray-600 group-active:scale-95 transition-all"></i>
                <span class="text-[10px] font-medium text-gray-400">Toko Saya</span>
            </button>
        </nav>
    </div>

    <script>
        let currentView = 'home';
        let role = 'buyer'; 
        let storeAuthMode = 'login'; 
        let isAddingProduct = false; 
        let isEditingProfile = false; 
        
        // Data Profil Toko yang Dapat Disinkronkan Termasuk Logo/Foto Toko
        let storeProfile = { 
            name: "bu siti", 
            phone: "+6281234040580",
            avatar: "" // URL Foto Toko / Logo
        };
        
        // Data Kategori UI
        const categories = [
            { name: "Semua", icon: "layout-grid", bg: "bg-[#009669]", textColor: "text-[#009669] font-bold", iconColor: "text-white" },
            { name: "Belanja & Retail", icon: "shopping-bag", bg: "bg-orange-100/70", textColor: "text-gray-600 font-medium", iconColor: "text-orange-500" },
            { name: "Kendaraan", icon: "car", bg: "bg-blue-100/70", textColor: "text-gray-600 font-medium", iconColor: "text-blue-500" },
            { name: "Properti", icon: "building-2", bg: "bg-indigo-100/70", textColor: "text-gray-600 font-medium", iconColor: "text-indigo-500" },
            { name: "Pendidikan", icon: "book-open", bg: "bg-yellow-100/70", textColor: "text-gray-600 font-medium", iconColor: "text-yellow-600" },
            { name: "Bisnis & Grosir", icon: "briefcase", bg: "bg-purple-100/70", textColor: "text-gray-600 font-medium", iconColor: "text-purple-500" },
            { name: "Hobi & Gaya Hidup", icon: "heart", bg: "bg-pink-100/70", textColor: "text-gray-600 font-medium", iconColor: "text-pink-500" },
            { name: "Produk Digital", icon: "monitor", bg: "bg-cyan-100/70", textColor: "text-gray-600 font-medium", iconColor: "text-cyan-500" },
            { name: "Jasa & Layanan", icon: "wrench", bg: "bg-green-100/70", textColor: "text-gray-600 font-medium", iconColor: "text-green-500" },
            { name: "Perjalanan & Wisata", icon: "plane", bg: "bg-teal-100/70", textColor: "text-gray-600 font-medium", iconColor: "text-teal-500" },
            { name: "Barang Bekas", icon: "archive", bg: "bg-amber-100/70", textColor: "text-gray-600 font-medium", iconColor: "text-amber-600" },
            { name: "Lainnya", icon: "more-horizontal", bg: "bg-gray-100", textColor: "text-gray-600 font-medium", iconColor: "text-gray-600" },
        ];

        // Data Kategori & Subkategori Lengkap
        const categoryData = {
            "Belanja & Retail": ["Logam Mulia & Emas", "Fashion & Busana", "Makanan & Minuman", "Kesehatan & Kecantikan", "Elektronik & Gadget", "Kebutuhan Rumah Tangga"],
            "Kendaraan": ["Mobil Baru", "Mobil Bekas", "Motor Baru", "Motor Bekas", "Aksesoris & Suku Cadang", "Rental Kendaraan"],
            "Properti": ["Rumah Dijual", "Rumah Disewakan / Kontrakan", "Tanah", "Apartemen / Kos-kosan", "Ruko & Komersial"],
            "Pendidikan": ["Buku & Alat Tulis", "Kursus & Bimbel", "Perlengkapan Sekolah", "Seragam"],
            "Bisnis & Grosir": ["Peluang Franchise", "Grosir Sembako", "Perlengkapan Usaha / Toko", "Bahan Baku"],
            "Hobi & Gaya Hidup": ["Olahraga & Outdoor", "Mainan & Koleksi", "Alat Musik", "Hewan Peliharaan", "Seni & Kerajinan"],
            "Produk Digital": ["Pulsa & Paket Data", "Token Listrik & PPOB", "Top-up Game", "Voucher Digital"],
            "Jasa & Layanan": ["Servis Elektronik & Kendaraan", "Desain & IT (Freelance)", "Jasa Fotografi & Video", "Jasa Kebersihan", "Kuliner Pesanan Khusus"],
            "Perjalanan & Wisata": ["Paket Umroh & Haji", "Tiket Transportasi", "Voucher Hotel & Penginapan", "Paket Wisata"],
            "Barang Bekas (Preloved)": ["Pakaian & Aksesoris Bekas", "Elektronik Bekas", "Buku Bekas", "Perabotan Bekas"],
            "Lainnya": ["Lain-lain / Umum"]
        };

        // Data Dummy Produk
        const products = [
            { id: 1, name: "Kurma Ajwa Premium Madinah", price: 120000, category: "Makanan", stock: 15, storeName: "bu siti", imgUrl: "https://images.unsplash.com/photo-1589539148230-0a5b707bc77c?auto=format&fit=crop&q=80&w=250" },
            { id: 2, name: "Madu Hutan Liar Sumatra", price: 85000, category: "Minuman", stock: 5, storeName: "bu siti", imgUrl: "https://images.unsplash.com/photo-1587049352847-4d4b12b1413e?auto=format&fit=crop&q=80&w=250" },
            { id: 3, name: "Saffron Khasmir Super Negin", price: 250000, category: "Kesehatan", stock: 2, storeName: "bu siti", imgUrl: "https://images.unsplash.com/photo-1616075304677-7429177a641a?auto=format&fit=crop&q=80&w=250" },
            { id: 4, name: "Minyak Zaitun Extra Virgin", price: 65000, category: "Kesehatan", stock: 10, storeName: "bu siti", imgUrl: "https://images.unsplash.com/photo-1474979266404-7eaacbcd87c5?auto=format&fit=crop&q=80&w=250" }
        ];
        
        let cart = [];
        let toastTimeout;

        lucide.createIcons();

        function render() {
            const content = document.getElementById('content');
            
            if (currentView === 'home') content.innerHTML = renderHome();
            else if (currentView === 'cart') content.innerHTML = renderCart();
            else if (currentView === 'store') content.innerHTML = renderStore();
            
            // Perbarui state Navigasi Bawah
            ['home', 'cart', 'store'].forEach(v => {
                const el = document.getElementById(`nav-${v}`);
                if (!el) return;
                
                const icon = el.querySelector('i, svg');
                const text = el.querySelector('span');

                if (icon && text) {
                    if(v === currentView) {
                        icon.classList.add('text-[#009669]');
                        icon.classList.remove('text-gray-400');
                        text.classList.add('text-[#009669]', 'font-bold');
                        text.classList.remove('text-gray-400', 'font-medium');
                    } else {
                        icon.classList.remove('text-[#009669]');
                        icon.classList.add('text-gray-400');
                        text.classList.remove('text-[#009669]', 'font-bold');
                        text.classList.add('text-gray-400', 'font-medium');
                    }
                }
            });

            // Perbarui Lencana Keranjang
            const badge = document.getElementById('cart-badge');
            if (cart.length > 0) {
                badge.textContent = cart.length;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }

            lucide.createIcons();
        }

        function renderHome() {
            let html = `
                <div class="bg-[#009669] pt-6 pb-6 px-4 rounded-b-[2rem] shadow-sm relative z-10">
                    <div class="bg-white rounded-full inline-flex items-center px-4 py-2 shadow-md">
                        <svg width="22" height="22" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" class="mr-1.5">
                            <path d="M16 1L1 9.5V22.5L16 31L31 22.5V9.5L16 1Z" fill="url(#hex-grad)"/>
                            <path d="M16 8L10 13.5V22H13.5V17H18.5V22H22V13.5L16 8Z" fill="white"/>
                            <defs>
                                <linearGradient id="hex-grad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
                                    <stop stop-color="#3B82F6" />
                                    <stop offset="1" stop-color="#10B981" />
                                </linearGradient>
                            </defs>
                        </svg>
                        <span class="text-blue-600 font-black text-xl tracking-tight leading-none pt-0.5">Halal<span class="text-fuchsia-500">Mall</span></span>
                    </div>

                    <div class="mt-5 bg-white rounded-full flex items-center px-4 py-3 shadow-md focus-within:ring-2 ring-white/50 transition-all">
                        <i data-lucide="search" class="w-5 h-5 text-gray-400 flex-shrink-0"></i>
                        <input type="text" placeholder="Cari Fashion, Kue, Jasa..." class="flex-1 bg-transparent border-none outline-none text-sm px-3 text-gray-800 placeholder-gray-400 font-medium">
                        <i data-lucide="tag" class="w-5 h-5 text-gray-400 flex-shrink-0 rotate-90"></i>
                    </div>

                    <div class="mt-5 relative h-[140px] rounded-2xl overflow-hidden shadow-xl group cursor-pointer border border-white/10">
                        <img src="https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&q=80&w=800" alt="Sayur Segar" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" />
                        <div class="absolute inset-0 bg-gradient-to-r from-black/80 via-black/30 to-transparent flex flex-col justify-center px-5">
                            <span class="text-[#00c98f] font-black text-[10px] tracking-widest uppercase mb-1 drop-shadow-md">TETANGGAKU</span>
                            <h3 class="text-white font-extrabold text-2xl leading-[1.1] drop-shadow-lg">Sayur Segar<br>Tiap Pagi</h3>
                        </div>
                        <div class="absolute bottom-2.5 left-1/2 transform -translate-x-1/2 flex gap-1.5 z-10">
                            <div class="w-1.5 h-1.5 rounded-full bg-white/40"></div>
                            <div class="w-4 h-1.5 rounded-full bg-white shadow-sm"></div>
                            <div class="w-1.5 h-1.5 rounded-full bg-white/40"></div>
                        </div>
                    </div>
                </div>
                
                <div class="px-5 mt-6 mb-8 relative z-0">
                    <div class="flex justify-between items-center mb-5">
                        <h2 class="font-extrabold text-gray-800 text-[17px]">Kategori Pilihan</h2>
                        <button class="text-[#009669] text-sm font-semibold flex items-center hover:opacity-80">Lihat Semua <i data-lucide="chevron-right" class="w-4 h-4 ml-0.5"></i></button>
                    </div>
                    
                    <div class="grid grid-cols-4 gap-y-6 gap-x-2">
            `;
            
            categories.forEach(cat => {
                html += `
                        <div class="flex flex-col items-center cursor-pointer group">
                            <div class="w-14 h-14 ${cat.bg} rounded-[1.1rem] flex items-center justify-center mb-2 group-hover:scale-105 transition-transform shadow-sm">
                                <i data-lucide="${cat.icon}" class="w-6 h-6 ${cat.iconColor}"></i>
                            </div>
                            <span class="text-[10px] ${cat.textColor} text-center leading-tight px-0.5">${cat.name}</span>
                        </div>
                `;
            });

            html += `
                    </div>
                </div>

                <div class="w-full h-2 bg-gray-100"></div>

                <div class="px-5 mt-6 pb-4">
                    <h2 class="font-extrabold text-gray-800 text-[17px] mb-4">Rekomendasi Halal</h2>
                    <div class="grid grid-cols-2 gap-4">
            `;
            
            products.forEach(p => {
                html += `
                    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden flex flex-col hover:shadow-md transition-shadow">
                        <div class="h-32 bg-gray-50 relative">
                            <img src="${p.imgUrl}" alt="${p.name}" class="w-full h-full object-cover"/>
                            <div class="absolute top-2 left-2 bg-white/90 backdrop-blur-sm text-[#009669] text-[9px] font-extrabold px-2 py-1 rounded-full uppercase tracking-wide shadow-sm">${p.category}</div>
                        </div>
                        <div class="p-3 flex flex-col flex-1">
                            <h3 class="font-semibold text-sm text-gray-800 leading-tight mb-2 line-clamp-2">${p.name}</h3>
                            <div class="flex items-center gap-1.5 mb-2">
                                <i data-lucide="store" class="w-3.5 h-3.5 text-gray-400"></i>
                                <span class="text-[10px] font-medium text-gray-500">${p.storeName}</span>
                            </div>
                            <div class="mt-auto">
                                <p class="text-[#009669] font-black text-sm mb-3">Rp ${p.price.toLocaleString('id-ID')}</p>
                                <button onclick="addToCart(${p.id})" class="w-full bg-[#009669]/10 text-[#009669] py-2 rounded-xl text-xs font-bold hover:bg-[#009669] hover:text-white transition-colors flex items-center justify-center gap-1.5">
                                    <i data-lucide="shopping-bag" class="w-3.5 h-3.5"></i> Beli
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            });
            html += `</div></div>`;
            return html;
        }

        function renderCart() {
            if (cart.length === 0) {
                return `
                    <div class="flex flex-col items-center justify-center h-full text-gray-400 pt-32 px-6 text-center">
                        <div class="bg-gray-50 p-6 rounded-full mb-5 shadow-sm border border-gray-100">
                            <i data-lucide="shopping-cart" class="w-16 h-16 text-gray-300"></i>
                        </div>
                        <h3 class="text-lg font-bold text-gray-700 mb-1">Keranjang Kosong</h3>
                        <p class="font-medium text-gray-400 text-sm mb-8">Temukan produk halal favoritmu dan masukkan ke sini.</p>
                        <button onclick="navigate('home')" class="bg-[#009669] text-white px-8 py-3 rounded-full font-bold shadow-lg shadow-emerald-200 hover:bg-emerald-700 transition">Mulai Belanja</button>
                    </div>`;
            }
            
            let total = 0;
            let html = `
                <div class="bg-[#009669] pt-12 pb-6 px-5 rounded-b-[2rem] shadow-sm">
                    <h2 class="text-2xl font-extrabold text-white">Keranjang</h2>
                    <p class="text-emerald-100 text-sm mt-1">Selesaikan pesanan Anda</p>
                </div>
                <div class="px-5 mt-6 pb-40 space-y-4">
            `;
            
            cart.forEach((item, index) => {
                total += item.price;
                html += `
                    <div class="flex justify-between items-center bg-white p-3.5 rounded-2xl shadow-sm border border-gray-100 group">
                        <div class="flex items-center gap-4">
                            <div class="w-16 h-16 bg-gray-50 rounded-xl overflow-hidden flex-shrink-0">
                                <img src="${item.imgUrl}" alt="${item.name}" class="w-full h-full object-cover"/>
                            </div>
                            <div>
                                <h4 class="font-bold text-sm text-gray-800 leading-tight mb-1">${item.name}</h4>
                                <p class="text-[#009669] text-sm font-black">Rp ${item.price.toLocaleString('id-ID')}</p>
                            </div>
                        </div>
                        <button onclick="removeFromCart(${index})" class="text-red-400 hover:text-red-600 p-2.5 bg-red-50 hover:bg-red-100 transition-colors rounded-xl flex-shrink-0">
                            <i data-lucide="trash-2" class="w-5 h-5"></i>
                        </button>
                    </div>
                `;
            });

            html += `</div>
                <div class="fixed sm:absolute bottom-[4.5rem] left-0 right-0 bg-white border-t border-gray-100 p-5 shadow-[0_-15px_30px_-5px_rgba(0,0,0,0.1)] z-10 rounded-t-3xl">
                    <div class="flex justify-between items-end mb-4 px-1">
                        <span class="font-bold text-gray-500 text-sm">Total Pembayaran</span>
                        <span class="text-[#009669] text-xl font-black">Rp ${total.toLocaleString('id-ID')}</span>
                    </div>
                    <button onclick="processCheckout()" class="w-full bg-[#009669] hover:bg-emerald-700 text-white font-bold py-4 rounded-2xl shadow-lg shadow-emerald-200 transition-all flex justify-center items-center gap-2">
                        Checkout Sekarang <i data-lucide="arrow-right" class="w-5 h-5"></i>
                    </button>
                </div>
            `;
            return html;
        }

        function renderStore() {
            if (role !== 'seller') {
                if (storeAuthMode === 'login') {
                    return `
                        <div class="flex flex-col items-center justify-center min-h-full pt-12 px-5 pb-24 bg-gray-50/30">
                            <div class="bg-white rounded-[2rem] p-7 w-full shadow-[0_10px_40px_rgba(0,0,0,0.06)] border border-gray-100 text-center">
                                <div class="w-16 h-16 bg-[#009669]/10 text-[#009669] rounded-full flex items-center justify-center mx-auto mb-5">
                                    <i data-lucide="lock" class="w-7 h-7"></i>
                                </div>
                                <h3 class="font-extrabold text-[22px] text-gray-900 mb-1.5 tracking-tight">Masuk ke Toko</h3>
                                <p class="text-[13px] text-gray-500 mb-7">Kelola jualan Anda di pasar digital syariah.</p>
                                <div class="space-y-4 mb-6">
                                    <input type="email" placeholder="Email Anda" class="w-full bg-gray-50/80 border border-gray-200 text-gray-800 text-sm rounded-2xl px-4 py-3.5 focus:outline-none focus:border-[#009669] focus:ring-1 focus:ring-[#009669] transition-all placeholder-gray-400 font-medium">
                                    <input type="password" placeholder="Password (Min. 6 Karakter)" class="w-full bg-gray-50/80 border border-gray-200 text-gray-800 text-sm rounded-2xl px-4 py-3.5 focus:outline-none focus:border-[#009669] focus:ring-1 focus:ring-[#009669] transition-all placeholder-gray-400 font-medium">
                                </div>
                                <button onclick="toggleRole()" class="w-full bg-[#009669] text-white font-extrabold py-3.5 rounded-2xl shadow-[0_8px_20px_rgba(0,150,105,0.25)] hover:bg-emerald-700 hover:-translate-y-0.5 transition-all mb-6">
                                    Masuk
                                </button>
                                <p class="text-[13px] text-gray-500 font-medium">
                                    Belum punya toko? <a href="#" onclick="toggleStoreAuthMode('register'); return false;" class="text-[#009669] font-bold underline decoration-2 underline-offset-2 hover:text-emerald-700 transition-colors">Daftar di sini</a>
                                </p>
                            </div>
                        </div>`;
                } else {
                    return `
                        <div class="flex flex-col items-center justify-center min-h-full pt-6 px-5 pb-24 bg-gray-50/30">
                            <div class="bg-white rounded-[2rem] p-7 w-full shadow-[0_10px_40px_rgba(0,0,0,0.06)] border border-gray-100 text-center">
                                <div class="w-16 h-16 bg-[#009669]/10 text-[#009669] rounded-full flex items-center justify-center mx-auto mb-4">
                                    <i data-lucide="lock" class="w-7 h-7"></i>
                                </div>
                                <h3 class="font-extrabold text-[22px] text-gray-900 mb-1.5 tracking-tight">Buka Toko Baru</h3>
                                <p class="text-[13px] text-gray-500 mb-6">Kelola jualan Anda di pasar digital syariah.</p>
                                <div class="space-y-3.5 mb-6 text-left">
                                    <input type="email" placeholder="Email Anda" class="w-full bg-gray-50/80 border border-gray-200 text-gray-800 text-sm rounded-2xl px-4 py-3.5 focus:outline-none focus:border-[#009669] focus:ring-1 focus:ring-[#009669] transition-all placeholder-gray-400 font-medium">
                                    <input type="password" placeholder="Password (Min. 6 Karakter)" class="w-full bg-gray-50/80 border border-gray-200 text-gray-800 text-sm rounded-2xl px-4 py-3.5 focus:outline-none focus:border-[#009669] focus:ring-1 focus:ring-[#009669] transition-all placeholder-gray-400 font-medium">
                                    <div class="py-1">
                                        <div class="border-t border-gray-100 w-full"></div>
                                    </div>
                                    <input type="text" placeholder="Nama Toko (Cth: Warung Bu Siti)" class="w-full bg-gray-50/80 border border-gray-200 text-gray-800 text-sm rounded-2xl px-4 py-3.5 focus:outline-none focus:border-[#009669] focus:ring-1 focus:ring-[#009669] transition-all placeholder-gray-400 font-medium">
                                    <input type="tel" placeholder="No. WhatsApp (Cth: 62812...)" class="w-full bg-gray-50/80 border border-gray-200 text-gray-800 text-sm rounded-2xl px-4 py-3.5 focus:outline-none focus:border-[#009669] focus:ring-1 focus:ring-[#009669] transition-all placeholder-gray-400 font-medium">
                                    <input type="text" placeholder="Lokasi (Cth: Jakarta Selatan)" class="w-full bg-gray-50/80 border border-gray-200 text-gray-800 text-sm rounded-2xl px-4 py-3.5 focus:outline-none focus:border-[#009669] focus:ring-1 focus:ring-[#009669] transition-all placeholder-gray-400 font-medium">
                                </div>
                                <button onclick="toggleRole()" class="w-full bg-[#009669] text-white font-extrabold py-3.5 rounded-2xl shadow-[0_8px_20px_rgba(0,150,105,0.25)] hover:bg-emerald-700 hover:-translate-y-0.5 transition-all mb-6">
                                    Daftar & Buka Toko
                                </button>
                                <p class="text-[13px] text-gray-500 font-medium">
                                    Sudah punya toko? <a href="#" onclick="toggleStoreAuthMode('login'); return false;" class="text-[#009669] font-bold underline decoration-2 underline-offset-2 hover:text-emerald-700 transition-colors">Masuk di sini</a>
                                </p>
                            </div>
                        </div>`;
                }
            }

            return `
                <div class="bg-[#009669] pt-10 pb-14 px-5 rounded-b-[2rem] shadow-sm relative z-0">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-[22px] font-extrabold text-white">Dashboard Toko</h2>
                        <div class="flex gap-2">
                            <button onclick="toggleEditProfile()" class="w-9 h-9 bg-white/20 rounded-full border border-white/30 text-white flex items-center justify-center hover:bg-white/30 transition-colors">
                                <i data-lucide="pencil" class="w-4 h-4"></i>
                            </button>
                            <button onclick="toggleRole()" class="w-9 h-9 bg-white/20 rounded-full border border-white/30 text-white flex items-center justify-center hover:bg-white/30 transition-colors">
                                <i data-lucide="log-out" class="w-4 h-4 text-white"></i>
                            </button>
                        </div>
                    </div>

                    <div class="flex items-center gap-4">
                        <div class="w-16 h-16 bg-white rounded-full flex items-center justify-center shadow-lg flex-shrink-0 overflow-hidden border-2 border-white/50">
                            ${storeProfile.avatar ? `<img src="${storeProfile.avatar}" alt="Logo Toko" class="w-full h-full object-cover">` : `<span class="text-[#009669] text-2xl font-black uppercase">${storeProfile.name.charAt(0)}</span>`}
                        </div>
                        <div>
                            <div class="flex items-center gap-1.5 mb-1">
                                <h3 class="text-white font-extrabold text-xl tracking-wide">${storeProfile.name}</h3>
                                <i data-lucide="check-circle-2" class="w-5 h-5 text-white fill-blue-500"></i>
                            </div>
                            <div class="flex items-center gap-1.5 text-white/90">
                                <i data-lucide="smartphone" class="w-3.5 h-3.5"></i>
                                <span class="text-xs font-medium tracking-wide">${storeProfile.phone}</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="px-5 -mt-6 relative z-10 pb-24">
                    ${isEditingProfile ? `
                        <button onclick="toggleEditProfile()" class="w-full bg-white border-2 border-[#009669] text-[#009669] font-extrabold py-3.5 rounded-2xl shadow-lg flex items-center justify-center hover:bg-gray-50 transition-colors mb-6">
                            Batal Edit Profil
                        </button>

                        <div class="bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden mb-8">
                            <div class="px-5 py-4 flex items-center gap-2 border-b border-gray-50 bg-gray-50/30">
                                <i data-lucide="user-cog" class="w-5 h-5 text-[#009669]"></i>
                                <h3 class="font-extrabold text-gray-900 text-[15px]">Ubah Profil & Logo Toko</h3>
                            </div>
                            <div class="p-5 space-y-4 text-left">
                                <div>
                                    <label class="text-[10px] font-bold text-gray-500 uppercase tracking-wider block mb-1.5">Nama Toko Baru</label>
                                    <input type="text" id="edit-store-name" value="${storeProfile.name}" class="w-full bg-gray-50/50 border border-gray-100 text-gray-800 text-sm rounded-xl px-4 py-3 focus:outline-none focus:border-[#009669] focus:ring-1 focus:ring-[#009669] transition-all font-medium">
                                </div>
                                <div>
                                    <label class="text-[10px] font-bold text-gray-500 uppercase tracking-wider block mb-1.5">Nomor Handphone</label>
                                    <input type="tel" id="edit-store-phone" value="${storeProfile.phone}" class="w-full bg-gray-50/50 border border-gray-100 text-gray-800 text-sm rounded-xl px-4 py-3 focus:outline-none focus:border-[#009669] focus:ring-1 focus:ring-[#009669] transition-all font-medium">
                                </div>
                                <div>
                                    <label class="text-[10px] font-bold text-gray-500 uppercase tracking-wider block mb-1.5">URL Logo / Foto Toko (Opsional)</label>
                                    <input type="url" id="edit-store-avatar" placeholder="https://contoh.com/logo-toko.jpg" value="${storeProfile.avatar}" class="w-full bg-gray-50/50 border border-gray-100 text-gray-800 text-sm rounded-xl px-4 py-3 focus:outline-none focus:border-[#009669] focus:ring-1 focus:ring-[#009669] transition-all font-medium">
                                    <p class="text-[10px] text-gray-400 mt-1">Masukkan link gambar atau biarkan kosong untuk menggunakan inisial huruf.</p>
                                </div>
                                <button onclick="saveProfile()" class="w-full bg-[#009669] text-white font-extrabold py-3.5 rounded-2xl shadow-[0_8px_20px_rgba(0,150,105,0.25)] hover:bg-emerald-700 transition-all mt-2">
                                    Simpan Perubahan
                                </button>
                            </div>
                        </div>
                    ` : !isAddingProduct ? `
                        <button onclick="toggleAddProduct()" class="w-full bg-white border border-[#009669] text-[#009669] font-extrabold py-3.5 rounded-2xl shadow-lg flex items-center justify-center gap-2 hover:bg-gray-50 transition-colors mb-8">
                            <i data-lucide="plus" class="w-5 h-5"></i> Tambah Dagangan Baru
                        </button>

                        <div class="flex items-center gap-2 mb-4 px-1">
                            <i data-lucide="layout-grid" class="w-5 h-5 text-[#009669]"></i>
                            <h3 class="font-extrabold text-gray-900 text-lg">Etalase Anda</h3>
                        </div>

                        <div class="border-2 border-dashed border-gray-200 bg-gray-50/50 rounded-2xl py-14 flex flex-col items-center justify-center mb-6">
                            <span class="text-gray-400 font-bold text-sm">Etalase masih kosong.</span>
                        </div>
                    ` : `
                        <button onclick="toggleAddProduct()" class="w-full bg-white border-2 border-[#009669] text-[#009669] font-extrabold py-3.5 rounded-2xl shadow-lg flex items-center justify-center hover:bg-gray-50 transition-colors mb-6">
                            Batal Tambah
                        </button>

                        <div class="bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden mb-8">
                            <div class="px-5 py-4 flex items-center gap-2 border-b border-gray-50 bg-gray-50/30">
                                <i data-lucide="store" class="w-5 h-5 text-[#009669]"></i>
                                <h3 class="font-extrabold text-gray-900 text-[15px]">Informasi Barang Baru</h3>
                            </div>
                            
                            <div class="p-5 space-y-4 text-left">
                                <div>
                                    <label class="text-[10px] font-bold text-gray-500 uppercase tracking-wider block mb-1.5">Nama Barang</label>
                                    <input type="text" placeholder="Contoh: Nasi Goreng" class="w-full bg-gray-50/50 border border-gray-100 text-gray-800 text-sm rounded-xl px-4 py-3 focus:outline-none focus:border-[#009669] focus:ring-1 focus:ring-[#009669] transition-all placeholder-gray-400 font-medium">
                                </div>
                                
                                <div>
                                    <label class="text-[10px] font-bold text-gray-500 uppercase tracking-wider block mb-1.5">Harga Barang (Rp)</label>
                                    <input type="number" placeholder="Contoh: 50000" class="w-full bg-gray-50/50 border border-gray-100 text-gray-800 text-sm rounded-xl px-4 py-3 focus:outline-none focus:border-[#009669] focus:ring-1 focus:ring-[#009669] transition-all placeholder-gray-400 font-medium">
                                </div>
                                
                                <div>
                                    <label class="text-[10px] font-bold text-gray-500 uppercase tracking-wider block mb-1.5 flex items-center gap-1.5">
                                        <i data-lucide="image" class="w-3.5 h-3.5 text-gray-400"></i> Foto Barang
                                    </label>
                                    <div class="border-2 border-dashed border-gray-200 bg-gray-50/30 rounded-xl py-8 flex flex-col items-center justify-center cursor-pointer hover:bg-gray-100 transition-colors">
                                        <i data-lucide="plus" class="w-6 h-6 text-gray-300 mb-2"></i>
                                        <span class="text-xs font-bold text-gray-400">Tap untuk Pilih Foto</span>
                                    </div>
                                </div>
                                
                                <div class="grid grid-cols-2 gap-3">
                                    <div>
                                        <label class="text-[10px] font-bold text-gray-500 uppercase tracking-wider block mb-1.5">Kategori</label>
                                        <div class="relative">
                                            <select onchange="updateSubcategories(this.value)" id="cat-select" class="w-full bg-gray-50/50 border border-gray-100 text-gray-800 text-sm rounded-xl px-3 py-3 focus:outline-none focus:border-[#009669] focus:ring-1 focus:ring-[#009669] appearance-none font-medium relative z-10 cursor-pointer">
                                                ${Object.keys(categoryData).map(cat => `<option value="${cat}">${cat}</option>`).join('')}
                                            </select>
                                            <div class="absolute right-3 top-1/2 transform -translate-y-1/2 z-0">
                                                <i data-lucide="chevron-down" class="w-4 h-4 text-gray-800"></i>
                                            </div>
                                        </div>
                                    </div>
                                    <div>
                                        <label class="text-[10px] font-bold text-gray-500 uppercase tracking-wider block mb-1.5">Subkategori</label>
                                        <div class="relative">
                                            <select id="subcat-select" class="w-full bg-gray-50/50 border border-gray-100 text-gray-800 text-sm rounded-xl px-3 py-3 focus:outline-none focus:border-[#009669] focus:ring-1 focus:ring-[#009669] appearance-none font-medium relative z-10 cursor-pointer">
                                                ${categoryData['Belanja & Retail'].map(sub => `<option value="${sub}">${sub}</option>`).join('')}
                                            </select>
                                            <div class="absolute right-3 top-1/2 transform -translate-y-1/2 z-0">
                                                <i data-lucide="chevron-down" class="w-4 h-4 text-gray-800"></i>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                
                                <div>
                                    <label class="text-[10px] font-bold text-gray-500 uppercase tracking-wider block mb-1.5">Deskripsi Singkat</label>
                                    <textarea rows="3" placeholder="Jelaskan spesifikasi..." class="w-full bg-gray-50/50 border border-gray-100 text-gray-800 text-sm rounded-xl px-4 py-3 focus:outline-none focus:border-[#009669] focus:ring-1 focus:ring-[#009669] transition-all placeholder-gray-400 font-medium resize-none"></textarea>
                                </div>
                                
                                <button onclick="saveProduct()" class="w-full bg-[#009669] text-white font-extrabold py-3.5 rounded-2xl shadow-[0_8px_20px_rgba(0,150,105,0.25)] hover:bg-emerald-700 transition-all mt-2">
                                    Tayangkan di Pasar
                                </button>
                            </div>
                        </div>
                    `}
                </div>
            `;
        }

        function navigate(view) {
            currentView = view;
            render();
        }

        function toggleRole() {
            role = role === 'buyer' ? 'seller' : 'buyer';
            
            if (role === 'seller' && currentView !== 'store') {
                navigate('store');
            } else if (role === 'buyer' && currentView === 'store') {
                navigate('home');
            } else {
                render();
            }
            showToastMessage(role === 'buyer' ? 'Beralih ke mode Pembeli' : 'Berhasil masuk ke Toko');
        }

        function toggleStoreAuthMode(mode) {
            storeAuthMode = mode;
            render();
        }

        function toggleAddProduct() {
            isAddingProduct = !isAddingProduct;
            if(isAddingProduct) isEditingProfile = false;
            render();
        }

        function toggleEditProfile() {
            isEditingProfile = !isEditingProfile;
            if(isEditingProfile) isAddingProduct = false;
            render();
        }

        function saveProfile() {
            const newName = document.getElementById('edit-store-name').value;
            const newPhone = document.getElementById('edit-store-phone').value;
            const newAvatar = document.getElementById('edit-store-avatar').value;
            
            if(newName.trim() === '') {
                showToastMessage('Nama toko tidak boleh kosong!');
                return;
            }

            storeProfile.name = newName;
            storeProfile.phone = newPhone;
            storeProfile.avatar = newAvatar;
            isEditingProfile = false; 

            // Sinkronisasi cerdas nama toko pada seluruh barang di Beranda
            products.forEach(p => {
                p.storeName = newName; 
            });

            showToastMessage('Profil & Logo Toko berhasil diperbarui!');
            render();
        }

        function saveProduct() {
            showToastMessage('Barang berhasil ditayangkan!');
            isAddingProduct = false;
            render();
        }

        function updateSubcategories(category) {
            const subSelect = document.getElementById('subcat-select');
            if(!subSelect) return;
            const subs = categoryData[category] || ["Lain-lain / Umum"];
            subSelect.innerHTML = subs.map(sub => `<option value="${sub}">${sub}</option>`).join('');
        }

        function addToCart(id) {
            const product = products.find(p => p.id === id);
            if(product) {
                cart.push(product);
                render();
                showToastMessage(`🛒 ${product.name} ditambahkan!`);
            }
        }
        
        function showToastMessage(message) {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.classList.remove('hidden');
            toast.classList.add('animate-bounce');
            
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('animate-bounce');
                toast.classList.add('hidden');
            }, 2500);
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            render();
        }

        function showModal(title, desc) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-desc').innerText = desc;
            const modal = document.getElementById('modal');
            modal.classList.remove('hidden');
            lucide.createIcons();
        }

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
        }

        function processCheckout() {
            showModal('Pesanan Diterima!', 'Terima kasih telah berbelanja di HalalMall. Fitur pembayaran lengkap segera hadir.');
            cart = [];
            navigate('home');
        }

        // Jalankan render awal aplikasi
        render();
    </script>
</body>
</html>
